<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
    <defs fill="#ffffff">
        <!-- Gradient background -->
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%" fill="#ffffff">
            <stop offset="0%" style="stop-color:#ffffff; stop-opacity:1" fill="#ffffff"/>
            <stop offset="100%" style="stop-color:#ffffff; stop-opacity:1" fill="#ffffff"/>
        </linearGradient>
    </defs>

    <!-- Rounded rectangle background -->
    <rect x="0" y="0" rx="20" ry="20" width="400" height="200" fill="#ffffff"/>

    <!-- "easy" text -->
    <text x="60" y="125" font-family="Arial, Helvetica, sans-serif" font-size="110" fill="#000000" font-weight="300">
        easy
    </text>

    <!-- "Sales" text -->
    <text x="420" y="125" font-family="Arial, Helvetica, sans-serif" font-size="110" fill="#ffffff" font-weight="700">
        Sales
    </text>
</svg>